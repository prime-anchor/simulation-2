<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>顧客台帳とLP問い合わせの参照シミュレーション</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/jquery-2.1.3.min.js" defer></script>
  <script src="js/script.js" defer></script>
</head>
<body>
  <header class="header">
    <h1>顧客台帳とLP問い合わせの参照シミュレーション</h1>
  </header>

  <main class="workspace">
    <div class="customer-area">
      <section class="card register-area">
        <h2>顧客を登録する</h2>
        <form id="customer-form">
          <label for="company">企業名</label>
          <div class="register-controls">
            <input id="company" type="text" placeholder="例：株式会社グー" required>
            <button class="secondary-button" type="submit">台帳に登録する</button>
          </div>
        </form>
        <p id="form-message" class="form-message" aria-live="polite"></p>
      </section>

      <section class="card ledger-area">
        <div class="card-heading">
          <h2>顧客台帳</h2>
          <span id="record-count" class="record-count">0件</span>
        </div>
        <p id="empty-message" class="empty-message">登録された企業はまだありません。</p>
        <ul id="list"></ul>
      </section>
    </div>

    <section class="card lp-area">
      <div class="card-heading">
        <h2>LPの公開と問い合わせ</h2>
        <span id="publication-status" class="publication-status" role="status">未公開</span>
      </div>

      <div id="unpublished" class="publish-panel">
        <p><strong>問い合わせを受け付けるには、LPを公開してください。</strong></p>
        <button id="publish" class="primary-button" type="button">
          LPを公開する <span aria-hidden="true">↗</span>
        </button>
      </div>

      <div id="published" hidden>
        <figure class="preview">
          <figcaption>公開されたLP</figcaption>
          <div class="preview-page">
            <div class="preview-header">
              <img src="css/logo_lp_test.png" alt="PrimeAnchor" width="609" height="90">
              <div class="preview-nav" aria-hidden="true">
                <span>サービス</span><span>取り組み例</span><span>進め方</span><span>支援メニュー</span>
                <span class="preview-nav-cta">相談する</span>
              </div>
            </div>
            <div class="preview-hero">
              <p class="preview-kicker">パートナーセールス　施策企画・制作代行</p>
              <p class="preview-copy">パートナーの顧客接点を、<br>商談が生まれる販路に。</p>
              <p class="preview-lead">パートナーの営業・マーケティング活動に、<br>貴社サービスの提案・紹介導線を組み込む。</p>
              <p class="preview-description">協業設計から共同施策の制作・展開、初期稼働まで一貫して支援。</p>
              <span class="preview-cta" aria-hidden="true">相談する</span>
            </div>
          </div>
        </figure>
        <section class="inquiry-area" aria-labelledby="inquiry-heading">
          <h3 id="inquiry-heading">問い合わせ</h3>
          <p id="inquiry-waiting" class="inquiry-waiting">問い合わせを待っています…</p>
          <ul id="inquiry-log" role="log" aria-label="問い合わせ履歴"></ul>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
